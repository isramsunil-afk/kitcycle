<!DOCTYPE html>
<html>
<head>
  <title>KitCycle 2.0 - Live</title>
  <style>
    body{font-family:Arial; text-align:center; padding:30px; background:#f0fff0}
   .card{background:white; padding:20px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1); max-width:400px; margin:auto}
    input{padding:10px; width:70%; border-radius:8px; border:1px solid #ccc}
    button{padding:10px 20px; background:green; color:white; border:none; border-radius:8px; margin-top:10px}
  </style>
</head>
<body>
  <h1>♻️ KitCycle 2.0</h1>
  <div class="card">
    <h3>Scan QR Code</h3>
    <input id="qrInput" placeholder="Ex: KIT-001-2024" value="KIT-001-2024">
    <br>
    <button onclick="checkKit()">Check Kit</button>
    <div id="result" style="margin-top:20px; text-align:left;"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_wOKnhv1F0uszgj9aNGhDd8x_HgsVnvw",
  authDomain: "kitcycle-2-0.firebaseapp.com",
  projectId: "kitcycle-2-0",
  storageBucket: "kitcycle-2-0.firebasestorage.app",
  messagingSenderId: "363327763111",
  appId: "1:363327763111:web:2ecc9c9373349d94cc2182"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.checkKit = async function(){
  const qr = document.getElementById("qrInput").value.trim();
  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "Searching Firebase...";

  const q = query(collection(db,"kits"), where("qrCode","==",qr));
  const snap = await getDocs(q);

  if(snap.empty){
    resultDiv.innerHTML = "<p style='color:red'>❌ Kit not found!</p>";
  } else {
    const kit = snap.docs[0].data();
    resultDiv.innerHTML = `
      <p style='color:green'><b>✅ Kit Found!</b></p>
      <p><b>Name:</b> ${kit.kitName}</p>
      <p><b>Health:</b> ${kit.health}%</p>
      <p><b>EcoCoins:</b> ${kit.ecoCoins}</p>
      <p><b>Status:</b> ${kit.status}</p>
    `;
  }
}
</script>
</body>
</html>
